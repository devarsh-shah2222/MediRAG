services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medirag
      POSTGRES_PASSWORD: medirag
      POSTGRES_DB: medirag
    ports:
      - "5432:5432"
    volumes:
      - medirag_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medirag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../services/api
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://medirag:medirag@db:5432/medirag
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../services/api:/app
      - medirag_uploads:/app/uploads

  web:
    build:
      context: ../apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  medirag_db:
  medirag_uploads:
