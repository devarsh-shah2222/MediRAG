databases:
  - name: medirag-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: medirag-api
    runtime: docker
    dockerfilePath: ./services/api/Dockerfile
    dockerContext: ./services/api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: medirag-db
          property: connectionString
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: AUTH_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DEFAULT_REGION
        value: US
